modLoader = "javafml"
loaderVersion = "${javaFmlVersionRange}"
license = "GPL-3.0-only"
issueTrackerURL = "https://github.com/KessokuTeaTime/Splasher/issues"

[[mods]]
modId = "splasher"
version = "${version}"
displayName = "${displayName}"
displayURL = "https://modrinth.com/mod/splasher"
logoFile = "assets/splasher/icon.png"
authors = "Kessoku Tea Time, KrLite"
description = "Makes Minecraft's splash texts fully customizable."

[features.splasher]
javaVersion = "[${javaVersion},)"

[[dependencies.splasher]]
modId = "neoforge"
type = "required"
versionRange = "${neoforgeVersionRange}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.splasher]]
modId = "minecraft"
type = "required"
versionRange = "${neoforgeMinecraftVersionRange}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.splasher]]
modId = "cloth_config"
type = "required"
versionRange = "[${clothConfigVersion},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.splasher]]
modId = "bounced"
type = "optional"
versionRange = "[${bouncedVersion},)"
ordering = "NONE"
side = "CLIENT"

[[mixins]]
config = "splasher.mixins.json"
